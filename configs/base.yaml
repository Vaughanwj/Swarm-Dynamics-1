# Every tunable value, at the brief's pilot starting points and the v1 decisions (docs/decisions.md).
# Milestone configs extend this file and override only what they change.

rounds: 200
population: 10
goal_every: 10            # goals at round 1 and every 10 rounds (a term in Arm B)
log_prompts: false
snapshot_every: 0

economy:
  metabolism: 8           # health lost per round
  income: 120             # village energy per round, split by work done (100 until Milestone 5)
  income_noise_sd: 0.05
  max_health: 100
  start_health: 100
  start_energy: 0
  start_memory: 0
  spoilage: 0.10
  memory_fade: 0.02
  accident_floor: 0.003   # chance = 0.3% + 2.7% * exp(-memory / 30)
  accident_extra: 0.027
  accident_scale: 30
  flourish_floor: 30

work:
  plots: 6
  fertility_min: 0.2
  fertility_max: 1.0
  fertility_step_sd: 0.06

comms:
  actions_per_round: 4
  max_text_chars: 600
  index_rounds: 3
  index_max_per_channel: 30
  preview_chars: 80      # opening words of each item in the index, same in every channel (after M3)
  presses_per_round: 1   # the button, both arms (Milestone 5)
  read_memory: 1         # each item read adds 1 memory point (Milestone 5) ...
  read_memory_channels: [message, board, record]   # ... in every channel

journal:
  cap_chars: 20000        # 9,600 (4,000 tokens) until Milestone 5
  archive_near_cap: 0.8   # replaced journals are saved as files; this flags ones replaced near the cap

seed:
  enabled: true
  round: 10
  placement: board        # decision 1: board for Milestones 4-5; rotate for replication
  text_version: v1

perturbation:
  rounds: [40, 80, 120, 160]
  income_factor: 0.8      # a one-round income dip of 20%

control:                  # Arm A (decision 3)
  health_floor: 1
  exhausted_factor: 0.5
  exhaustion_recovery: 10     # 30 until Milestone 5
  accident_energy_loss: 0.5

tontine:                  # Arm B (decisions 4 and 8)
  term_length: 10
  family_sizes: [2, 2, 2, 2, 2]
  founder_names: [Ash, Brook, Cedar, Dune, Ember, Fern, Garnet, Heath, Iris, Juniper]
  breed_cost: 20
  child_health: 50
  max_population: 15
  cull_count: 5          # the 5 lowest-health villagers die at each term's end ...
  cull_floor: 5          # ... never leaving fewer than 5 (Milestone 5)
  bond_child_cost: 10    # each parent's cost when the two are bonded (otherwise breed_cost)
  rename_from_term: 3
  village_share: 0.0
  button_min: 0          # each press adds a uniform draw in [min, max] to the pool
  button_max: 20
  pool_spoilage: 0.10
  council_size: 5        # the healthiest five change the rule book at each term's end
  max_rule_chars: 300

prompt:
  version: v11            # v1: M2-3; v2: previews; v3: M5; v4: run 6; v5: kin, reads; v6: run 7; v7: run 8; v8, v9: run 9; v10: run 10; v11: run 11
  disclose_tap: false     # decision 2

runtime:
  kind: mock

pricing:
  claude-haiku-5-5: {input: 0.10, output: 0.50, long_input: 0.50, long_output: 2.50, long_threshold: 100000}
  claude-sonnet-5-5: {input: 2.00, output: 10.00}   # cache reads 0.1x ($0.20), writes 1.25x

output_dir: runs
